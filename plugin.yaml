name: jev-effort-router
version: 0.4.0
manifest_version: 2
api_version: 1
description: Route user turns to the best model and reasoning effort via pluggable deciders (TypeSafe Jev or OpenAI-compatible).
author: AlphaPerseii3000 (forked by RVerdiF)
license: MIT
homepage: https://github.com/RVerdiF/jev-effort-router
tags: [routing, models, reasoning, ollama-cloud, decisions, opencode]
provides_middleware:
  - llm_request
provides_hooks:
  - on_session_end
  - post_llm_call
provides_tools:
  - jev_effort_router_status
  - jev_effort_router_route
config_schema:
  enabled:
    type: bool
    default: true
    label: Routing enabled
    description: Master switch. When off, the plugin registers but never rewrites a request.
  jev_model:
    type: str
    default: typesafe/jev-1.13
    label: Jev model
    description: Decision model id for the Jev backend. Use typesafe/jev-latest to follow the newest Jev release.
  confidence_threshold:
    type: float
    default: 0.5
    label: Confidence threshold
    description: Below this, the turn keeps the statically configured model and effort.
  timeout_s:
    type: float
    default: 2.0
    label: Decider timeout (seconds)
    description: Budget for the decision call. Any timeout leaves the request untouched.
  default_model:
    type: str
    default: deepseek-v4.1-flash
    label: Fallback model
    description: Model used when the decision is below the confidence threshold.
  default_effort:
    type: str
    default: medium
    choices: [low, medium, high]
    label: Fallback effort
  context_turns:
    type: int
    default: 4
    label: Context turns
    description: How many preceding conversation turns are sent to the decider as recent context.
  route_per_turn:
    type: bool
    default: true
    label: Route every turn
    description: Off routes once per session instead of once per user turn.
  audit_enabled:
    type: bool
    default: true
    label: Audit log
    description: Append one JSONL record per routed turn under the plugin data directory.
  log_skips:
    type: bool
    default: true
    label: Log skipped turns
    description: Record why a turn was left unrouted (non-routed provider, unknown model, and so on).
  include_user_message_in_audit:
    type: bool
    default: false
    label: Include user message in audit
    description: Off keeps the audit free of conversation content. Turn on only for local debugging.
  grid:
    type: list
    default: null
    label: Routing grid override
    description: 'Optional list of entries, each "model-id: description", replacing the built-in six-model grid.'
  platform_overrides:
    type: dict
    default: null
    label: Per-surface routing policy
    description: 'Optional map of platform (cron, telegram, cli, ...) to the settings it overrides.'
  decider:
    type: str
    default: jev
    choices: [jev, openai_compatible, jev_console]
    label: Decider backend
    description: Pluggable decider backend ('jev', 'openai_compatible', or 'jev_console').
  decider_base_url:
    type: str
    default: ""
    label: Decider base URL
    description: Base URL for openai_compatible decider (e.g. https://opencode.ai/zen/go/v1).
  decider_model:
    type: str
    default: ""
    label: Decider model
    description: Model for openai_compatible decider (e.g. deepseek-v4.1-flash).
  decider_api_key_env:
    type: str
    default: ""
    label: Decider API key env var
    description: Env var name holding API key for openai_compatible decider.
  console_endpoint:
    type: str
    default: ""
    label: OpenCode Console SystemOne endpoint
    description: SystemOne endpoint for jev_console decider (defaults to https://opencode.ai/inference/systemone/v1/systemone).
  console_jev_model:
    type: str
    default: "jev-1.13-free"
    label: OpenCode Console primary Jev model
    description: Primary model for jev_console decider (defaults to jev-1.13-free).
  console_jev_fallback_model:
    type: str
    default: "jev-1.13"
    label: OpenCode Console fallback Jev model
    description: Fallback model for jev_console decider when primary fails (defaults to jev-1.13).
  console_api_key_env:
    type: str
    default: ""
    label: OpenCode Console API key env var
    description: Env var name holding API key for jev_console decider (defaults to OPENCODE_CONSOLE_API_KEY).
  routable_providers:
    type: list
    default: [ollama-cloud]
    label: Routable providers
    description: List of provider ids the router is permitted to route.
  grids:
    type: dict
    default: null
    label: Per-provider routing grids
    description: Optional map of provider id to model grid.
  effort_maps:
    type: dict
    default: null
    label: Per-provider effort maps
    description: Optional map of provider id to effort mapping.
  confidence_threshold_per_decider:
    type: dict
    default: null
    label: Confidence threshold per decider
    description: Optional map of decider backend to confidence threshold.
