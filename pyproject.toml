[project]
name = "hermes-plugin-jev-effort-router"
version = "0.4.0"
description = "Hermes plugin — route each user turn to an optimal model and reasoning effort via TypeSafe Jev or OpenAI-compatible deciders."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.15.0",
]
